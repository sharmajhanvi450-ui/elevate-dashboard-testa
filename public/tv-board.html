    position: fixed; top: 0; right: 0; width: 60px; height: 60px; z-index: 500; cursor: default;

    position: fixed; top: 10px; right: 10px; z-index: 501;

    font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: #eef0f7; width: 240px;

// ── Scoring — identical formulas to live/public/index.html ──────────────────
const B_T = { calls:150, minutes:180, leads:4, discoveries:2, presBooked:2, presCompleted:2 };
const B_W = { calls:0.20, minutes:0.20, leads:0.10, discoveries:0.15, presBooked:0.10, presCompleted:0.25 };
const C_T = { calls:60, minutes:120, presentations:2 };
const C_W = { calls:0.40, minutes:0.20, presentations:0.40 };
const cap = (v, t) => Math.min(150, t > 0 ? (v / t) * 100 : 0);

function scoreBuilder(b, t) {
  return Math.round(
    cap(b.calls,t.calls)*B_W.calls + cap(b.minutes,t.minutes)*B_W.minutes +
    cap(b.leads,t.leads)*B_W.leads + cap(b.discoveries,t.discoveries)*B_W.discoveries +
    cap(b.presBooked,t.presBooked)*B_W.presBooked + cap(b.presCompleted,t.presCompleted)*B_W.presCompleted
  );
}
function scoreCloser(c, t) {
  const k = cap(c.calls,t.calls)*C_W.calls + cap(c.minutes,t.minutes)*C_W.minutes + cap(c.presentations,t.presentations)*C_W.presentations;
  if (c.dealsClosed >= 2) return Math.round(Math.min(Math.max(k * 1.50, 110), 150));
  if (c.dealsClosed === 1) return Math.round(Math.min(Math.max(k * 1.25, 95), 125));
  return Math.round(Math.min(k, 110));
}

// Builds the BDE view model from the raw /api/bde rows, using the same
// weighted-KPI scoring as the BD Scorecard page. `wDays` scales the daily
// targets to the period being shown.
function buildBdeTeams(bdes, wDays) {
  const byName = {};
  bdes.forEach(b => { byName[(b.name||"").toLowerCase()] = b; });

  return BDE_TEAMS.map(team => {
    const members = team.members.map(name => {
      const b = byName[name.toLowerCase()] || {};
      let score = 0;
      const rows = team.kpis.map(k => {
        const target = Math.max(1, Math.round(k.dailyTarget * wDays));
        const actual = k.get(b);
        const pct = Math.min(150, target > 0 ? (actual / target) * 100 : 0);
        score += pct * k.weight;
        return {
          label: k.label,
          note: `${k.note} · ${Math.round(k.weight * 100)}%`,
          actual, target,
          pctLabel: Math.round(pct) + "%",
          color: barColor(pct),
          bar: Math.min(100, (pct / 150) * 100).toFixed(0),
        };
      });
      score = Math.round(score);
      const cur = b.cur || {}, old = b.old || {};
      return {
        name, role: team.role, tl: BDE_TEAM_LEADS[name] || "—",
        score, tier: zone(score), rows,
        funnel: BDE_FUNNEL.map(([label, key]) => ({ label, val: ((cur[key]||0) + (old[key]||0)).toLocaleString() })),
      };
    }).sort((a, b) => b.score - a.score);

    const avg = members.length ? Math.round(members.reduce((s, m) => s + m.score, 0) / members.length) : 0;
    return {
      name: team.name, score: avg, tier: zone(avg),
      note: team.kpis.map(k => `${k.label} ${k.dailyTarget}/day (${Math.round(k.weight*100)}%)`).join(" · "),
      span: members.length >= 4 ? 2 : 1,
      members,
    };
  });
}

// Working-hours day-fraction proration (today only) — mirrors index.html.
const WORK_START_H = 10.5, WORK_END_H = 19.5, WORK_HOURS = 9.0;
function etParts() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
  }).formatToParts(new Date()).reduce((a, p) => (a[p.type] = p.value, a), {});
}
// Today's date in America/New_York as YYYY-MM-DD.
// Previously this was fmtDate(estNow()), which converted to Eastern twice —
// once building estNow() and again in fmtDate — shifting the result 9.5h back
// and making the board request YESTERDAY's data between midnight and ~10am ET.
function todayET() { const p = etParts(); return `${p.year}-${p.month}-${p.day}`; }
// The Team Leader card reports revenue, admissions and conversion for the month
// so far. On today's numbers alone those three read 0 / 0 / 0% for most of the
// day, which tells nobody anything.
function monthStartET() { const p = etParts(); return `${p.year}-${p.month}-01`; }
// Eastern wall-clock hour as a decimal (e.g. 14.5 for 2:30pm).
function etHour() { const p = etParts(); return Number(p.hour) + Number(p.minute) / 60; }
function dayFraction(dateStr, isCustomRange) {
  if (isCustomRange) return 1; // a picked historical range is always "full"
  if (dateStr !== todayET()) return 1;
  const h = etHour();
  if (h <= WORK_START_H) return 0.01;
  if (h >= WORK_END_H) return 1;
  return (h - WORK_START_H) / WORK_HOURS;
}

// ── Promo slides ─────────────────────────────────────────────────────────────
// Full-screen poster slides shown between the three data boards. Managed from

// editing to add, remove or reorder a slide. The list is stored in the
// `tv_slides` table, pointing at files in the `tv-slides` Storage bucket.
const SLIDES_BUCKET_URL = `${SUPABASE_URL}/storage/v1/object/public/tv-slides/`;
let ACTIVE_SLIDES = [];   // filled in by loadPromoSlides(), only ones that loaded
let _renderedSlide = null; // which slide is currently in the DOM, so render() can skip no-op rebuilds
// Fingerprint of the last slide list actually verified. Comparing against this
// is what stops loadPromoSlides() re-downloading every enabled slide in full on
// every 3-minute refresh — each was ~1.2MB, and at 480 refreshes/day that was
// ~576MB/day for a single unchanging slide, which is what pushed Supabase's
// free-tier egress over quota. It starts undefined, which no real key (even
// "" for zero slides) can ever equal, so the first run always verifies.
let _slideListKey;

// Pulls the enabled slide list (in order) from Supabase. Only re-verifies each
// image actually loads — the expensive part — when that list has changed since
// the last check; otherwise the existing ACTIVE_SLIDES is left alone. A slide
// whose file is missing, or the fetch itself failing, is dropped rather than
// showing a blank screen on the TV.
async function loadPromoSlides() {
  let rows = null;
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/tv_slides?select=storage_path&enabled=eq.true&order=sort_order.asc`,
      { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
    );
    if (r.ok) rows = await r.json();
  } catch (e) {
    console.error("TV board: failed to load slide list (non-fatal):", e.message);
  }
  if (rows === null) return; // list fetch failed — keep whatever was last verified

  const key = rows.map(row => row.storage_path).join("|");
  if (key === _slideListKey) return; // unchanged since last check — nothing to re-download
  _slideListKey = key;

  const urls = rows.map(row => SLIDES_BUCKET_URL + row.storage_path);

  // Each slide is fetched once and held as an object URL, rather than letting
  // the <img> point at Storage directly.
  //
  // The rotation rebuilds the poster every time it comes back round: five views
  // at thirty seconds is a fresh <img> every 150 seconds, about 576 a day. And
  // Supabase serves these with Cache-Control: no-cache, which it applies no
  // matter what cache-control the upload sends. A 1.25 MB poster was therefore
  // worth roughly 700 MB of egress a day from a single board.
  //
  // A blob costs one fetch per slide per page load: a few MB a day across the
  // four-hourly kiosk reloads, and it does not depend on Storage honouring any
  // header. Old object URLs are revoked so a board left running does not
  // accumulate them.
  ACTIVE_SLIDES.forEach(u => { if (u.startsWith("blob:")) URL.revokeObjectURL(u); });
  const results = await Promise.all(urls.map(async src => {
    try {
      const r = await fetch(src);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return URL.createObjectURL(await r.blob());
    } catch (e) {
      console.error("TV board: slide failed to load, skipping:", src, e.message);
      return null;
    }
  }));
  ACTIVE_SLIDES = results.filter(Boolean);
}

const viewLabel = i => VIEW_LABELS[i] || "Slide " + (i - DATA_VIEWS + 1);

function pipsMarkup(view) {
  return Array.from({ length: totalViews() }, (_, i) => {

    const pages = i === 0 ? builderPages().length : 1;
    const done  = i === 0 ? STATE.page : 0;
    const fill = i < view ? 100 : i > view ? 0
      : Math.min(100, ((done + STATE.elapsed / secondsForView(i)) / pages) * 100).toFixed(0);
    const on = i === view;
    return `<button class="tv-pip" data-view="${i}" title="${on && STATE.paused ? "Resume rotation" : "Jump to " + viewLabel(i)}"
      style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 4px">
      <span style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:${on ? "#eef0f7" : "#5c6488"}">${viewLabel(i)}</span>
      <span style="display:block;width:56px;height:5px;border-radius:3px;background:rgba(255,255,255,0.12);overflow:hidden">
        <span style="display:block;height:5px;border-radius:3px;background:${on && STATE.paused ? "#ffab00" : "#eef0f7"};width:${fill}%"></span>
      </span>
    </button>`;
  }).join("");
}

function goToView(i) {
  if (i === STATE.view) { STATE.paused = !STATE.paused; }
  else { STATE.view = i; STATE.page = 0; STATE.elapsed = 0; STATE.paused = true; }
  render();
  runCountUp();
}
// Delegated: the strip's innerHTML is rewritten twice a second, so listeners
// bound to the buttons themselves would not survive.
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".tv-pip");
  if (b) goToView(Number(b.dataset.view));
});
// A leaderboard needs long enough to read a column of names and numbers; a
// poster is taken in at a glance. One duration for both meant that dropping the
// slides to ten seconds would have flipped the data boards just as fast, so the
// two are separate.
//
// With 18 brag-board slides the full cycle is 4x30 + 18x10 = 300s, so each data
// board comes round once every five minutes rather than every two and a half.
// That is the deliberate cost of showing the whole set.
const ROTATE_SECONDS = 30;   // data boards
const SLIDE_SECONDS  = 10;   // promo slides
const secondsForView = v => (v >= DATA_VIEWS ? SLIDE_SECONDS : ROTATE_SECONDS);

// The Builder board splits across slides rather than shrinking to fit. Eighteen
// builders on one screen meant five columns of four, and at that row count the
// cards are too short to read from across the floor. Nine to a slide keeps them
// at the size they were designed for and just takes two turns instead of one.
const BUILDERS_PER_PAGE = 9;

// Split evenly, so ten builders give two slides of five rather than nine and a
// lone card on its own screen.
function builderPages() {
  const b = STATE.builders;
  const n = Math.max(1, Math.ceil(b.length / BUILDERS_PER_PAGE));
  const per = Math.ceil(b.length / n);
  return Array.from({ length: n }, (_, i) => b.slice(i * per, (i + 1) * per));
}

// Don't paint until real data has arrived — painting an empty board on
// initial fit(), then again on the resize event(s) the browser fires right
// after navigation, then again once data loads, is what produced the
// "blinks 3 times" flash when coming back to this page.
let _dataLoadedOnce = false;

// The board is drawn at a fixed 1920x1080 and scaled down to the window. The
// scale used to live only in STATE, written into the markup by render() — so
// whenever the window's size and the last render disagreed, the board stayed
// at the old scale, overflowed the window and was clipped on the right. Write
// it straight onto the node instead: that costs nothing, needs no re-render,
// and can be redone after every render and on every size change.
const BOARD_W = 1920, BOARD_H = 1080;
function applyScale() {
  const el = document.getElementById("board-canvas");
  if (!el) return;
  // clientWidth excludes a scrollbar; innerWidth does not. Either can read 0
  // on a hidden or not-yet-laid-out tab, and scaling to that would leave the
  // board stuck at the 0.1 floor once it became visible — keep the last good
  // scale until there is a real size to work from.
  const w = document.documentElement.clientWidth  || window.innerWidth;
  const h = document.documentElement.clientHeight || window.innerHeight;
  if (!w || !h) return;
  const next = Math.max(0.1, Math.min(w / BOARD_W, h / BOARD_H));
  if (Math.abs(next - STATE.scale) < 0.0001 && el.style.transform) return;
  STATE.scale = next;
  el.style.transform = `scale(${next.toFixed(4)})`;
}
function fit() {
  applyScale();
  if (_dataLoadedOnce) render();
}
let _resizeTimer = null;
function onResize() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(fit, 150);
}

// If data fetches keep failing (e.g. an expired auth session on a tab left
// open for hours), don't just sit there empty — reload the whole page after
// a few consecutive misses so it comes back with a fresh session.
let _consecutiveLoadFailures = 0;
async function loadData() {
  const today = todayET();
  const startDate = STATE.isLive ? today : STATE.rangeStart;
  const endDate = STATE.isLive ? today : STATE.rangeEnd;
  try {
    // Month-to-date closers feed only the Team Leader card's three money
    // figures; everything else on the board stays on the selected range. It is
    // its own cache key, so this costs one Zoho call per 20 minutes, not one
    // per refresh. A failure here leaves those tiles on the daily numbers
    // rather than taking the board down.
    const mtdStart = STATE.isLive ? monthStartET() : startDate;
    const [leaveMap, builderData, closerData, bdes, mtdCloserData] = await Promise.all([
      fetchLeaveMap(startDate, endDate),
      fetchRole("Builder", startDate, endDate),
      fetchRole("Closer", startDate, endDate),
      fetchBde(startDate, endDate),
      mtdStart === startDate
        ? Promise.resolve(null)
        : fetchRole("Closer", mtdStart, endDate).catch(e => {
            console.error("TV board: month-to-date closers failed (non-fatal):", e.message);
            return null;
          }),
    ]);

    STATE.mtdRange = mtdCloserData ? { start: mtdStart, end: endDate } : null;
    STATE.mtdByName = {};
    (mtdCloserData?.closers || []).forEach(c => { STATE.mtdByName[c.name] = c; });
    const frac = dayFraction(endDate, !STATE.isLive);
    const T = Object.fromEntries(Object.entries(B_T).map(([k,v]) => [k, Math.max(1, Math.round(v * frac))]));
    const TC = Object.fromEntries(Object.entries(C_T).map(([k,v]) => [k, Math.max(1, Math.round(v * frac))]));

    STATE.builders = (builderData.builders || []).map(b => {
      const onLeave = (leaveMap[b.name] || 0) >= frac;
      const s = onLeave ? 0 : scoreBuilder(b, T);
      return { ...b, score: s, tier: onLeave ? "leave" : zone(s), role: "Builder", onLeave, team: teamOf(b) };
    }).sort((a,b) => (a.onLeave?1:0) - (b.onLeave?1:0) || b.score - a.score);

    STATE.closers = (closerData.closers || []).map(c => {
      const onLeave = (leaveMap[c.name] || 0) >= frac;
      const s = onLeave ? 0 : scoreCloser(c, TC);
      return { ...c, score: s, tier: onLeave ? "leave" : zoneCloser(c, s), role: "Closer", onLeave, team: teamOf(c) };
    }).sort((a,b) => (a.onLeave?1:0) - (b.onLeave?1:0) || b.score - a.score);

    // BDE targets are daily rates, so scale them by the same day fraction the
    // Builder/Closer targets use — the board is showing today, not month-to-date.
    STATE.bdeTeams = buildBdeTeams(bdes, frac);

    STATE.now = new Date();
    _consecutiveLoadFailures = 0;
  } catch (e) {
    console.error("TV board data load failed:", e.message);
    _consecutiveLoadFailures++;
    if (_consecutiveLoadFailures >= 3) { location.reload(); return; }
  }
  render();
}

// The person's own teamLead, which api/report.js now derives from their Zoho
// role. It used to be filled from the Team_Lead field on whichever record was
// read first, which left eight people blank and put two on the wrong card.
function teamOf(person) {
  if (person && person.teamLead) return person.teamLead;
  const m = SALES_TEAM_MEMBERS.find(x => x.name === (person && person.name));
  return m ? m.team : "—";
}

// Card grid geometry. The board is a fixed 1920x1080 canvas, so a bigger roster
// means shorter cards. Pick the column count that keeps the grid to as few rows
// as it can without leaving holes, then shrink each card's internals to match
// the row height — without the shrink, the KPI tiles overflow their row and land
// on top of the call-breakdown line beneath them, which is what going from 8
// builders to 12 did to the board.
function gridFor(n) {
  let cols = 5, best = Infinity;
  for (let c = 3; c <= 5; c++) {
    const rows = Math.ceil(n / c);
    // Fewer rows first — rows are what squeeze the cards — then fewer empty
    // cells. Weighting holes above rows sent 17 people into six short rows.
    const score = rows * 10 + (c * rows - n);
    if (score < best) { best = score; cols = c; }
  }
  const rows = Math.ceil(n / cols);
  // Largest density each row count can hold without the KPI tiles overflowing.
  // Measured against the grid's real height on the 1920x1080 canvas.
  const DENSITY = { 1: 1, 2: 1, 3: 0.85, 4: 0.63, 5: 0.49 };
  return { cols, rows, density: DENSITY[rows] || 0.45 };
}

// Today's team roll-up behind the three figures on the Team Leader card.
// Deliberately the same shape as the History page's teamTotals(): revenue,
// admissions and presentations held are all closer-side. A builder row also
// carries a deal count for the deals they sourced, but never the money or the
// presentation behind them, so counting those would report the same enrolment
// twice against a revenue figure that never included it.
// `mtd` maps a closer's name to their month-to-date record; when it is missing
// (or a name isn't in it) the member's own figures are used, so this still
// works on a fixed range and stays comparable with history.html's teamTotals().
function teamRollup(members, mtd) {
  const t = { revenue: 0, newUpfront: 0, futureUpfront: 0, admissions: 0, presHeld: 0 };
  members.forEach(m => {
    if (m.role !== "Closer") return;
    const src = (mtd && mtd[m.name]) || m;
    t.newUpfront    += src.newUpfront || 0;
    t.futureUpfront += src.futureUpfront || 0;
    t.admissions    += src.dealsClosed || 0;
    t.presHeld      += src.presentations || 0;
  });
  t.revenue   = t.newUpfront + t.futureUpfront;
  t.avgTicket = t.admissions ? t.revenue / t.admissions : 0;
  t.convPct   = t.presHeld ? Math.round(t.admissions / t.presHeld * 100) : 0;
  t.convColor = !t.presHeld ? "#6c769b" : t.convPct >= 50 ? "#00e676" : t.convPct >= 25 ? "#ffd740" : "#ff4d6a";
  return t;
}

        ${statTile("Avg Ticket Size", roll.admissions ? money(roll.avgTicket) : "—", money(roll.revenue) + " revenue", "#40c4ff")}
        ${statTile("Admissions", roll.admissions, money(roll.newUpfront) + " new · " + money(roll.futureUpfront) + " future", "#00e676")}
        ${statTile("Pres → Enrolment", roll.presHeld ? roll.convPct + "%" : "—", roll.admissions + " of " + roll.presHeld + " held", roll.convColor)}
      </div>
    </div>
    <div style="flex:1;min-height:0;display:grid;grid-template-rows:repeat(${rowSlots},minmax(0,1fr))">${membersHtml}</div>
  </div>`;
}

// One BDE's card: KPI rows on top, summary funnel along the bottom.
function bdeMemberCard(m) {
  const t = TIER[m.tier];
  const celebrate = m.tier === "gold";
  // A display row (a lead-type breakdown) is context, not a target, so it
  // carries target: null. Calling toLocaleString() on that threw, and the throw
  // came out of render() — which left the whole board unpainted and stuck at
  // whatever scale it last had, on every view, not just this one.
  const num = v => (v === null || v === undefined || Number.isNaN(v)) ? null : Number(v).toLocaleString();
  const rowsHtml = m.rows.map(r => `
    <div style="border-radius:9px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06);padding:7px 10px;display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:12px;font-weight:800;letter-spacing:0.9px;color:#c3cae0;text-transform:uppercase;white-space:nowrap">${r.label}</span>
        <span style="flex:1;min-width:0;font-size:10px;font-weight:700;color:#6c769b;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.note}</span>
        <span style="font-family:'Nunito Sans',sans-serif;font-size:20px;font-weight:900;line-height:1;color:#eef0f7;font-variant-numeric:tabular-nums">${num(r.actual) ?? "—"}</span>
        ${num(r.target) != null ? `<span style="font-size:11px;font-weight:700;color:#6c769b">/ ${num(r.target)}</span>` : ""}
        <span style="font-size:13px;font-weight:900;color:${r.color};min-width:44px;text-align:right">${r.pctLabel}</span>
      </div>
      <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden">
        <div style="height:4px;border-radius:2px;background:${r.color};width:${r.bar}%"></div>
      </div>
    </div>`).join("");

  const funnelHtml = m.funnel.map(f => `
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
      <span style="font-size:9.5px;font-weight:800;letter-spacing:0.9px;color:#6c769b;text-transform:uppercase;white-space:nowrap">${f.label}</span>
      <span style="font-family:'Nunito Sans',sans-serif;font-size:18px;font-weight:900;line-height:1;color:#c3cae0;font-variant-numeric:tabular-nums">${f.val}</span>
    </div>`).join("");

  return `<div style="position:relative;border-radius:14px;padding:13px 15px;border:1.5px solid ${t.line};background:${t.bg};box-shadow:0 0 22px ${t.rgb(0.26)}, inset 0 0 46px ${t.rgb(0.06)};overflow:hidden;display:flex;flex-direction:column;gap:9px;animation:omRise 0.5s ease both">
    ${celebrate ? `<div style="position:absolute;top:0;bottom:0;left:0;width:150px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);animation:omShine 4.2s ease-in-out infinite;pointer-events:none"></div>` : ""}
    <div style="display:flex;align-items:center;gap:11px">
      <div style="width:52px;height:52px;border-radius:50%;flex:none;border:2px solid ${t.line};background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-size:17px;font-weight:900;color:${t.ink}">${initials(m.name)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Nunito Sans',sans-serif;font-size:19px;font-weight:800;line-height:1.05;color:#f4f6fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#7b86ad;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.role} · TL ${m.tl}</div>
        <div style="display:inline-flex;margin-top:5px;padding:3px 9px;border-radius:999px;border:1px solid ${t.ink};background:rgba(255,255,255,0.05);font-size:11px;font-weight:900;letter-spacing:1.2px;color:${t.ink};text-transform:uppercase;white-space:nowrap">${t.label}</div>
      </div>
      <div class="tv-cnt" data-final="${m.score}" style="text-align:right;flex:none;width:84px;font-family:'Nunito Sans',sans-serif;font-size:34px;font-weight:900;line-height:0.95;white-space:nowrap;color:${t.ink};text-shadow:0 0 20px ${t.ink};font-variant-numeric:tabular-nums">0%</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;justify-content:center">${rowsHtml}</div>
    <div style="display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08)">${funnelHtml}</div>
  </div>`;
}

// A BDE team: header strip with the team average, then its member cards.
function bdeTeamBlock(bt) {
  const t = TIER[bt.tier];
  return `<div style="grid-column:span ${bt.span};min-width:0;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;border:1px solid ${t.line};background:rgba(255,255,255,0.035)">
      <div style="font-family:'Nunito Sans',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.4px;color:${t.ink};white-space:nowrap">${bt.name}</div>
      <div style="padding:2px 9px;border-radius:999px;border:1px solid ${t.ink};font-size:11px;font-weight:900;letter-spacing:1.2px;color:${t.ink};white-space:nowrap">${t.label}</div>
      <div style="flex:1;min-width:0;font-size:11px;font-weight:700;letter-spacing:0.8px;color:#6c769b;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${bt.note}</div>
      <div class="tv-cnt" data-final="${bt.score}" style="font-family:'Nunito Sans',sans-serif;font-size:28px;font-weight:900;line-height:1;white-space:nowrap;color:${t.ink};font-variant-numeric:tabular-nums">0%</div>
    </div>
    <div style="flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:repeat(${bt.span},minmax(0,1fr));grid-auto-rows:minmax(0,1fr)">
      ${bt.members.map(bdeMemberCard).join("")}
    </div>
  </div>`;
}

function render() {
  document.getElementById("board-root").style.display = "block";
  const { builders, closers, bdeTeams } = STATE;

  // Promo slides sit after the three data boards and render full-bleed, with
  // none of the board chrome — they are posters, not dashboards.
  if (STATE.view >= DATA_VIEWS) {
    const src = ACTIVE_SLIDES[STATE.view - DATA_VIEWS];
    // The 3-minute data refresh also calls render(). Rebuilding the markup
    // would recreate the <img> and make the poster flash, so only touch the
    // DOM when the slide has actually changed.
    if (_renderedSlide !== src) {
      _renderedSlide = src;
      document.getElementById("board-root").innerHTML = `
        <div style="position:fixed;inset:0;background:#fbf8f0;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <img src="${src}" alt="" style="width:100%;height:100%;object-fit:contain;display:block">
        </div>`;
    }
    return;
  }
  _renderedSlide = null;   // back on a data board — next slide must rebuild

  const clock = STATE.now.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: true });
  const dateLabel = STATE.now.toLocaleDateString("en-US", { timeZone: "America/New_York", day: "numeric", month: "short", year: "numeric" }).toUpperCase();
  const h = etHour();
  const frac = h <= WORK_START_H ? 0.01 : h >= WORK_END_H ? 1 : (h - WORK_START_H) / WORK_HOURS;
  const view = STATE.view;
  const pipsHtml = pipsMarkup(view);

  let cardsHtml = "", cols = 5, viewTitle = "", viewSub = "", leaderHtml = "", leaderScoreFinal = 0, totalsHtml = "", tickerText = "";

  if (view === 3) {
    // Auto-arrange: as many columns as the teams need (2+1+1 = 4 today), so
    // they sit on one row with no empty columns — matching the design.
    cols = Math.max(1, bdeTeams.reduce((s, t) => s + t.span, 0));
    cardsHtml = bdeTeams.map(bdeTeamBlock).join("");
    viewTitle = "BDE Scorecard";
    viewSub = "Today · weighted lead-generation targets";
    const allBdes = bdeTeams.flatMap(t => t.members);
    const top = allBdes.slice().sort((a, b) => b.score - a.score)[0] || { name: "—", score: 0, tier: "red" };
    leaderHtml = `${initials(top.name)}|${top.name}|TOP BDE · ${TIER[top.tier].label}`;
    leaderScoreFinal = top.score;
    totalsHtml = bdeTeams.map(t => ({
      label: t.name, value: t.score + "%", hint: t.members.length + " BDE",
      color: TIER[t.tier].ink, bar: Math.min(100, (t.score / 150) * 100).toFixed(0),
    }));
    const sumStage = key => allBdes.reduce((s, m) => {
      const f = m.funnel.find(x => x.label === key);
      return s + (f ? Number(String(f.val).replace(/,/g, "")) : 0);
    }, 0);
    const golds = allBdes.filter(m => m.tier === "gold").length;
    tickerText = top.name.toUpperCase() + " LEADS THE BDE BOARD AT " + top.score + "%   ·   "
      + golds + " GOLDEN CARDS   ·   LEADS GENERATED " + sumStage("Generated").toLocaleString()
      + "   ·   QUALIFIED " + sumStage("Qualified").toLocaleString()
      + "   ·   ENROLLED " + sumStage("Enrolled").toLocaleString() + "   ·   ";
  } else if (view === 2) {
    const all = [...builders, ...closers];
    // Teams come from the people actually in the report, so a transfer or a new
    // lead shows up without a code edit. Config order first, so the board's
    // familiar left-to-right layout does not shuffle.
    const configOrder = [...new Set(SALES_TEAM_MEMBERS.map(m => m.team))];
    const present = new Set(all.map(m => m.team).filter(n => n && n !== "—"));
    const teamNames = [
      ...configOrder.filter(n => present.has(n)),
      ...[...present].filter(n => !configOrder.includes(n)).sort(),
    ];
    const teams = teamNames.map(name => {
      const members = all.filter(m => m.team === name);
      // On-leave members count as 0 toward the average, so health reflects
      // the whole roster rather than just who's active today.
      const health = members.length ? Math.round(members.reduce((s,m) => s+m.score, 0) / members.length) : 0;
      return { name, members, health };
    });
    cols = teams.length || 1;
    // One shared row count across the cards: without it each card divided its
    // own height by its own member count, so an eight-person team's rows sat
    // between a ten-person team's and nothing lined up across the board.
    const rowSlots = Math.max(1, ...teams.map(t => t.members.length));
    cardsHtml = teams.map(t => teamCard(t.name, t.members, rowSlots)).join("");
    viewTitle = "Team Leader Board"; viewSub = "Team health score · average of all member scores";
    const best = teams.slice().sort((a,b) => b.health - a.health)[0] || { name: "—", health: 0 };
    leaderHtml = `${initials(best.name)}|${best.name}|TOP TEAM`;
    leaderScoreFinal = best.health;
    totalsHtml = teams.map(t => {
      const tk = TIER[zone(t.health)];
      return { label: t.name, value: t.health+"%", hint: t.members.length+" members", color: tk.ink, bar: Math.min(100,(t.health/150)*100).toFixed(0) };
    });
    tickerText = teams.map(t => t.name.toUpperCase()+" "+t.health+"%").join("   ·   ") + "   ·   TEAM HEALTH INCLUDES MEMBERS ON LEAVE   ·   ";
  } else if (view === 1) {
    const g = gridFor(closers.length);
    cols = g.cols;
    cardsHtml = closers.map((p,i) => personCard(p, i, true, g.density)).join("");
    viewTitle = "Closer Board"; viewSub = "Follow-up calls 40% · call minutes 20% · presentations held 40% · deal multiplier";
    const top = closers[0] || { name:"—", score:0, tier:"red" };
    leaderHtml = `${initials(top.name)}|${top.name}|TOP CLOSER · ${TIER[top.tier].label}`;
    leaderScoreFinal = top.score;
    const sum = k => closers.reduce((s,c) => s+(c[k]||0), 0);
    const n = closers.length || 1;
    totalsHtml = [
      { label:"Follow-up Calls", value:sum("calls"), hint:"/ "+n*C_T.calls, color:"#ff8a78", bar:Math.min(100,(sum("calls")/(n*C_T.calls))*100).toFixed(0) },
      { label:"Call Minutes", value:sum("minutes"), hint:"/ "+n*C_T.minutes, color:"#ffab00", bar:Math.min(100,(sum("minutes")/(n*C_T.minutes))*100).toFixed(0) },
      { label:"Pres. Held", value:sum("presentations"), hint:"/ "+n*C_T.presentations, color:"#40c4ff", bar:Math.min(100,(sum("presentations")/(n*C_T.presentations))*100).toFixed(0) },
      { label:"Deals Closed", value:sum("dealsClosed"), hint:"today", color:"#00e676", bar:100 },
      { label:"Revenue", value:"$"+((sum("revenue"))/1000).toFixed(1)+"K", hint:"collected", color:"#00e676", bar:100 },
    ];
    tickerText = "DEALS CLOSED "+sum("dealsClosed")+"   ·   REVENUE $"+sum("revenue").toLocaleString()+"   ·   "+top.name.toUpperCase()+" LEADS AT "+top.score+"%   ·   2+ DEALS = GUARANTEED GOLDEN CARD   ·   ";
  } else {
    // One slide of the roster at a time. The rank badge is the builder's
    // position on the whole board, not on the slide, so #10 stays #10 when it
    // moves to the second screen.
    const pages = builderPages();
    const page  = Math.min(STATE.page, pages.length - 1);
    const shown = pages[page] || [];
    const offset = pages.slice(0, page).reduce((n, p) => n + p.length, 0);
    const g = gridFor(shown.length);
    cols = g.cols;
    cardsHtml = shown.map((p,i) => personCard(p, offset + i, false, g.density)).join("");
    viewTitle = "Builder Board";
    viewSub = (pages.length > 1 ? `Ranks ${offset+1}–${offset+shown.length} of ${builders.length} · slide ${page+1}/${pages.length} · ` : "")
      + "Calls 20% · minutes 20% · leads 10% · discoveries 15% · pres booked 10% · pres completed 25%";
    const top = builders[0] || { name:"—", score:0, tier:"red" };
    leaderHtml = `${initials(top.name)}|${top.name}|TOP BUILDER · ${TIER[top.tier].label}`;
    leaderScoreFinal = top.score;
    const sum = k => builders.reduce((s,b) => s+(b[k]||0), 0);
    const n = builders.filter(b => !b.onLeave).length || 1;
    totalsHtml = [
      { label:"Outbound Calls", value:sum("calls"), hint:"/ "+n*B_T.calls, color:"#ff8a78", bar:Math.min(100,(sum("calls")/(n*B_T.calls))*100).toFixed(0) },
      { label:"Call Minutes", value:sum("minutes"), hint:"/ "+n*B_T.minutes, color:"#ffab00", bar:Math.min(100,(sum("minutes")/(n*B_T.minutes))*100).toFixed(0) },
      { label:"Qualified Leads", value:sum("leads"), hint:"/ "+n*B_T.leads, color:"#40c4ff", bar:Math.min(100,(sum("leads")/(n*B_T.leads))*100).toFixed(0) },
      { label:"Discoveries", value:sum("discoveries"), hint:"/ "+n*B_T.discoveries, color:"#b388ff", bar:Math.min(100,(sum("discoveries")/(n*B_T.discoveries))*100).toFixed(0) },
      { label:"Pres. Completed", value:sum("presCompleted"), hint:"/ "+n*B_T.presCompleted, color:"#00e676", bar:Math.min(100,(sum("presCompleted")/(n*B_T.presCompleted))*100).toFixed(0) },
    ];
    const golds = builders.filter(b => b.tier === "gold").length;
    tickerText = top.name.toUpperCase()+" HOLDS #1 AT "+top.score+"%   ·   "+golds+" GOLDEN CARDS ON THE FLOOR   ·   TEAM CALLS "+sum("calls")+" / "+n*B_T.calls+"   ·   110%+ = GOLDEN CARD   ·   ";
  }

  const [linit, lname, lsub] = leaderHtml.split("|");
  const totalsBlockHtml = totalsHtml.map(t => `
    <div style="flex:1;min-width:0;padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.09);background:rgba(255,255,255,0.03);display:flex;flex-direction:column;justify-content:center;gap:5px">
      <div style="font-size:12px;font-weight:800;letter-spacing:1.9px;color:#7b86ad;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.label}</div>
      <div style="display:flex;align-items:baseline;gap:7px">
        <span style="font-family:'Nunito Sans',sans-serif;font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:${t.color}">${t.value}</span>
        <span style="font-size:12px;font-weight:700;color:#6c769b">${t.hint}</span>
      </div>
      <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden">
        <div style="height:4px;border-radius:2px;background:${t.color};width:${t.bar}%"></div>
      </div>
    </div>`).join("");

  document.getElementById("board-root").innerHTML = `
  <div style="position:fixed;inset:0;background:#05060b;display:flex;align-items:center;justify-content:center">
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
      <div style="position:absolute;width:1100px;height:1100px;left:-260px;top:-380px;border-radius:50%;background:radial-gradient(circle,rgba(255,77,58,0.16) 0%,transparent 62%);animation:omDrift 26s ease-in-out infinite"></div>
      <div style="position:absolute;width:1000px;height:1000px;right:-240px;bottom:-360px;border-radius:50%;background:radial-gradient(circle,rgba(0,230,118,0.13) 0%,transparent 62%);animation:omDrift 34s ease-in-out infinite reverse"></div>
    </div>
    <div id="board-canvas" style="width:1920px;height:1080px;flex:none;position:relative;transform-origin:50% 50%;transform:scale(${STATE.scale.toFixed(4)})">
      <div style="position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:92px auto 1fr 54px;padding:22px 40px 18px;gap:14px">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0;border-bottom:1px solid rgba(255,255,255,0.09);padding-bottom:14px">
          <div style="display:flex;align-items:center;gap:20px">
            <img src="/e92c4bab-2eb7-4e8f-bc76-e00992442f1f.png" alt="ElevateMe" style="height:46px;width:auto;display:block" />
            <div style="width:1px;height:42px;background:rgba(255,255,255,0.12)"></div>
            <div style="display:flex;flex-direction:column;gap:2px;max-width:1000px;min-width:0">
              <div style="font-family:'Nunito Sans',sans-serif;font-size:38px;font-weight:900;letter-spacing:1px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${viewTitle}</div>
              <div style="font-size:12px;font-weight:700;letter-spacing:1.4px;color:#7b86ad;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${viewSub}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:34px">
            <div style="display:flex;align-items:center;gap:9px;padding:7px 16px;border:1px solid rgba(255,77,58,0.5);border-radius:999px;background:rgba(255,77,58,0.09)">
              <div style="width:9px;height:9px;border-radius:50%;background:#ff4d3a;box-shadow:0 0 10px #ff4d3a;animation:omPulse 1.6s ease-in-out infinite"></div>
              <span style="font-size:14px;font-weight:800;letter-spacing:2.4px;color:#ff8a78">${STATE.isLive ? "LIVE" : "HISTORICAL"}</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
              <div id="tv-datelabel" style="font-size:13px;font-weight:700;letter-spacing:2.2px;color:#7b86ad;text-transform:uppercase">${dateLabel}</div>
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:150px;height:5px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden">
                  <div id="tv-fracbar" style="height:5px;border-radius:3px;background:linear-gradient(90deg,#ff4d3a,#ffab00);width:${Math.round(frac*100)}%"></div>
                </div>
                <span id="tv-fracpct" style="font-size:13px;font-weight:800;color:#ffab00;font-variant-numeric:tabular-nums">${Math.round(frac*100)}% OF DAY</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <div id="tv-clock" style="font-family:'Nunito Sans',sans-serif;font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums">${clock}</div>
              <div style="font-size:12px;font-weight:700;letter-spacing:2.4px;color:#7b86ad">EST</div>
            </div>
            <div id="tv-pips" style="display:flex;align-items:center;gap:7px">${pipsHtml}</div>
          </div>
        </div>

        <div style="display:flex;align-items:stretch;gap:12px;min-width:0">
          <div style="display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:12px;border:1px solid rgba(255,215,64,0.34);background:linear-gradient(100deg,rgba(255,215,64,0.14),rgba(255,215,64,0.02));flex:0 0 510px;min-width:0;position:relative;overflow:hidden">
            <div style="position:absolute;inset:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);animation:omShine 5s ease-in-out infinite"></div>
            <div style="font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:2.6px;color:#ffd740;writing-mode:vertical-rl;transform:rotate(180deg)">LEADER</div>
            <div style="width:56px;height:56px;border-radius:50%;flex:none;background:rgba(255,215,64,0.14);border:2px solid #ffd740;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Nunito Sans',sans-serif;font-size:20px;font-weight:900;color:#ffd740">${linit}</div>
            <div style="flex:1;min-width:0">
              <div style="font-family:'Nunito Sans',sans-serif;font-size:30px;font-weight:900;letter-spacing:0.6px;line-height:1.05;color:#ffe484;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lname}</div>
              <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:#a2914f;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lsub}</div>
            </div>
            <div class="tv-cnt" data-final="${leaderScoreFinal}" style="font-family:'Nunito Sans',sans-serif;font-size:52px;font-weight:900;line-height:1;color:#ffd740;text-shadow:0 0 22px rgba(255,215,64,0.55);font-variant-numeric:tabular-nums">0%</div>
          </div>
          ${totalsBlockHtml}
        </div>

        <div style="display:grid;gap:12px;grid-template-columns:repeat(${cols},minmax(0,1fr));grid-auto-rows:minmax(0,1fr);min-height:0">
          ${cardsHtml}
        </div>

        <div style="border-radius:10px;border:1px solid rgba(255,255,255,0.09);background:rgba(255,255,255,0.035);overflow:hidden;display:flex;align-items:center">
          <div style="flex:none;padding:0 20px;height:100%;display:flex;align-items:center;background:#ff4d3a;font-size:14px;font-weight:900;letter-spacing:2.4px;color:#fff">FLOOR FEED</div>
          <div style="flex:1;min-width:0;overflow:hidden;padding-left:18px">
            <div style="display:flex;width:max-content;animation:omMarquee 46s linear infinite">
              <div style="flex:none;width:max-content;padding-right:80px;font-size:17px;font-weight:700;letter-spacing:1.4px;color:#c9cfe4;white-space:nowrap">${tickerText}</div>
              <div style="flex:none;width:max-content;padding-right:80px;font-size:17px;font-weight:700;letter-spacing:1.4px;color:#c9cfe4;white-space:nowrap">${tickerText}</div>
            </div>
          </div>
          <div style="flex:none;padding:0 20px;display:flex;gap:16px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1.5px">
            <span style="color:#ffd740">● GOLD 110+</span>
            <span style="color:#00e676">● GREEN 95–110</span>
            <span style="color:#ffab00">● YELLOW 75–95</span>
            <span style="color:#ff6d00">● ORANGE 50–75</span>
            <span style="color:#ff4d6a">● RED &lt;50</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  // render() replaces the canvas node, so the scale has to go back on. Reading
  // the window here rather than trusting STATE means a resize that arrived
  // before the board had data still lands correctly on this first paint.
  applyScale();

  // render() is also called directly (resize, the 3-min data refresh) with
  // no animateScores() to follow — snap every score straight to its final
  // value so it never gets stuck showing the "0%" placeholder. The
  // animated 0->final count-up only happens via the explicit runCountUp()
  // path (initial load, view rotation), which overrides this right after.
  document.querySelectorAll(".tv-cnt").forEach(el => {
    const final = parseFloat(el.dataset.final);
    if (!isNaN(final)) el.textContent = Math.round(final) + "%";
  });
}

// Lightweight per-tick chrome update (clock/date/day-progress/pips) that
// patches only those DOM nodes directly, instead of rebuilding the whole
// board every 500ms — a full render() reset the ticker's CSS animation and
// reloaded every avatar <img> on each tick, which is what caused the
// screen-blink and the "stuck" marquee.
function updateChrome() {
  const clockEl = document.getElementById("tv-clock");
  if (!clockEl) return; // board not rendered yet
  const clock = STATE.now.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: true });
  const dateLabel = STATE.now.toLocaleDateString("en-US", { timeZone: "America/New_York", day: "numeric", month: "short", year: "numeric" }).toUpperCase();
  const h = etHour();
  const frac = h <= WORK_START_H ? 0.01 : h >= WORK_END_H ? 1 : (h - WORK_START_H) / WORK_HOURS;
  clockEl.textContent = clock;
  document.getElementById("tv-datelabel").textContent = dateLabel;
  document.getElementById("tv-fracbar").style.width = Math.round(frac*100)+"%";
  document.getElementById("tv-fracpct").textContent = Math.round(frac*100)+"% OF DAY";
  const view = STATE.view;
  document.getElementById("tv-pips").innerHTML = pipsMarkup(view);
}

// render() rebuilds the whole board's DOM, including every avatar <img>.
// Calling it on every animation step (even throttled to 12 steps/sec)
// still recreated every image a dozen times in a row, which is what kept
// causing visible flicker during the 0% -> final count-up. Only the score
// percentage text actually changes during that animation — everything
// else (avatars, names, KPI grids, bars) is identical before and after —
// so render() now runs exactly ONCE per data/view change, and the count-up
// only updates text on the tagged `.tv-cnt` elements directly, with zero
// DOM rebuilds.
function runCountUp() {
  render();
  animateScores();
}
function animateScores() {
  clearTimeout(window._tvCountTimer);
  const nodes = Array.from(document.querySelectorAll(".tv-cnt"));
  const STEPS = 16, dur = 900;
  let i = 0;
  const step = () => {
    try {
      const k = Math.min(1, i / STEPS);
      const eased = 1 - Math.pow(1 - k, 3);
      nodes.forEach(el => {
        const final = parseFloat(el.dataset.final);
        if (!isNaN(final)) el.textContent = Math.round(final * eased) + "%";
      });
      i++;
      if (k < 1) window._tvCountTimer = setTimeout(step, dur / STEPS);
    } catch (e) {
      console.error("TV board countUp step failed:", e.message);
      i++;
      window._tvCountTimer = setTimeout(step, dur / STEPS);
    }
  };
  step();
}

let _tick = null;
function startTicking() {
  if (_tick) clearInterval(_tick);
  _tick = setInterval(() => {
    try {
      STATE.now = new Date();
      // Paused means someone jumped to a view to look at it — hold there, but
      // keep the clock and the data refresh running.
      // Cheap enough to do on every tick, and it means the board cannot stay
      // at the wrong scale for more than half a second no matter which resize
      // signal the TV's browser fails to send. Returns immediately when the
      // scale has not moved.
      applyScale();
      if (STATE.paused) { updateChrome(); return; }
      STATE.elapsed += 0.5;
      if (STATE.elapsed >= secondsForView(STATE.view)) {
        const pages = STATE.view === 0 ? builderPages().length : 1;
        if (STATE.page + 1 < pages) { STATE.page += 1; }
        else { STATE.page = 0; STATE.view = (STATE.view + 1) % totalViews(); }
        STATE.elapsed = 0;
        runCountUp();
      } else {
        updateChrome();
      }
    } catch (e) {
      console.error("TV board tick failed:", e.message);
    }
  }, 500);
}
let _dataRefresh = null;
function startDataRefresh() {
  if (_dataRefresh) clearInterval(_dataRefresh);
  _dataRefresh = setInterval(() => {
    if (STATE.isLive) loadData();
    // Re-check the slide list too, so uploading/removing/reordering a slide
    // from Manage Slides shows up on the TV within a few minutes — no
    // restart needed. If the list shrank while a now-missing slide happened
    // to be showing, snap back to view 0 rather than rendering a blank slot.
    loadPromoSlides().then(() => {
      if (STATE.view >= totalViews()) { STATE.view = 0; STATE.elapsed = 0; }
    });
  }, 3 * 60 * 1000);
}

function initBoard() {
  fit();
  window.addEventListener("resize", onResize);
  // A resize event is not guaranteed for every size change a TV browser goes
  // through — entering kiosk mode, the on-screen chrome settling after load,
  // a display waking up. Observing the element catches those too.
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(document.documentElement);
  // Work out which slides actually exist before ticking, so the rotation
  // never lands on a slide that would render blank.
  loadPromoSlides().then(() => {
    startTicking();
    startDataRefresh();
    loadData().then(() => { _dataLoadedOnce = true; runCountUp(); });
  });
  // Kiosk safeguard: force a full reload every 4 hours so a tab left open
  // indefinitely always ends up running the latest deployed code and a
  // fresh session, without anyone needing to walk over and refresh it.
  setTimeout(() => location.reload(), 4 * 60 * 60 * 1000);
}

// ── Hidden settings panel wiring ─────────────────────────────────────────────
const settingsBtn = document.getElementById("settings-btn");
const settingsPanel = document.getElementById("settings-panel");
settingsBtn.onclick = () => {
  settingsBtn.classList.toggle("open");
  settingsPanel.classList.toggle("open");
};
document.getElementById("btn-apply-range").onclick = () => {
  const s = document.getElementById("range-start").value;
  const e = document.getElementById("range-end").value;
  if (!s || !e) return;
  STATE.isLive = false;
  STATE.rangeStart = s;
  STATE.rangeEnd = e;
  document.getElementById("mode-note").textContent = `Currently: HISTORICAL (${s} to ${e}, rotation paused)`;
  if (_tick) clearInterval(_tick);
  loadData();
};
document.getElementById("btn-reset-live").onclick = () => {
  STATE.isLive = true;
  document.getElementById("mode-note").textContent = "Currently: LIVE (today, auto-rotating)";
  loadData();
  startTicking();
};

// No login on test — board starts immediately.
initBoard();
</script>
</body>
</html>
