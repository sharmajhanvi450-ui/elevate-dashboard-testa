<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElevateMe — Floor TV Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #05060b; overflow: hidden; height: 100%; font-family: 'Nunito Sans', sans-serif; color: #eef0f7; }
  @keyframes omDrift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(4%,-3%,0) scale(1.15); } 100% { transform: translate3d(0,0,0) scale(1); } }
  @keyframes omShine { 0% { transform: translateX(-120%) skewX(-18deg); } 55%, 100% { transform: translateX(320%) skewX(-18deg); } }
  @keyframes omPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes omMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes omRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .tv-avatar-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }

  /* Tiny hidden control — invisible until hovered, top-right corner */
  #hidden-controls-trigger {
    position: fixed; top: 0; right: 0; width: 60px; height: 60px; z-index: 500; cursor: default;
  }
  #settings-btn {
    position: fixed; top: 10px; right: 10px; z-index: 501;
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04); color: #6b7499; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; transition: opacity 0.2s;
  }
  #hidden-controls-trigger:hover + #settings-btn, #settings-btn:hover, #settings-btn.open { opacity: 1; }
  #settings-panel {
    position: fixed; top: 46px; right: 10px; z-index: 501; display: none;
    background: #0f1322; border: 1px solid #1e2640; border-radius: 12px; padding: 16px;
    font-family: 'Nunito Sans', sans-serif; font-size: 13px; color: #eef0f7; width: 240px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #settings-panel.open { display: block; }
  #settings-panel label { display: block; font-size: 11px; color: #7b86ad; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 4px; }
  #settings-panel input[type="date"] {
    width: 100%; background: #05060b; border: 1px solid #1e2640; color: #eef0f7;
    padding: 7px 8px; border-radius: 6px; font-size: 13px; color-scheme: dark;
  }
  #settings-panel .row { display: flex; gap: 8px; margin-top: 12px; }
  #settings-panel button {
    flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #btn-apply-range { background: #ff4d3a; color: #fff; }
  #btn-reset-live { background: rgba(255,255,255,0.08); color: #eef0f7; }
  #settings-panel .mode-note { font-size: 11px; color: #7b86ad; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Hidden ad-hoc date control — invisible on the TV, only shows on mouse hover (for setup/debugging on a machine with a mouse, not meant to be touched on the TV itself) -->
<div id="hidden-controls-trigger"></div>
<div id="settings-btn" title="View a specific date (hidden control)">⚙</div>
<div id="settings-panel">
  <label>Start date</label>
  <input type="date" id="range-start">
  <label>End date</label>
  <input type="date" id="range-end">
  <div class="row">
    <button id="btn-apply-range">View Range</button>
    <button id="btn-reset-live">Reset to Live</button>
  </div>
  <div class="mode-note" id="mode-note">Currently: LIVE (today, auto-rotating)</div>
</div>

<div id="board-root" style="display:none"></div>

<script>
// Test environment — no auth anywhere, this page's own Supabase project (same
// one api/report.js / api/refresh.js / attendance use on test).
const SUPABASE_URL  = "https://czfsjrvngiojjjevmvtz.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6ZnNqcnZuZ2lvampqZXZtdnR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODc0NzIsImV4cCI6MjA5ODA2MzQ3Mn0.IbK1th8wcdrHOgJL1y5kQE3De1c0HSe0ju4Q9vNQ9BQ";

// Sales roster (inlined — test has no shared config.js).
const SALES_TEAM_MEMBERS = [
  { name: "Yashraj Modasara",  team: "Soham",     role: "Builder" },
  { name: "Aryan Sharma",      team: "Soham",     role: "Builder" },
  { name: "Dhruvil Chauhan",   team: "Soham",     role: "Builder" },
  { name: "Avni Gajjar",       team: "Soham",     role: "Builder" },
  { name: "Maharshi Patel",    team: "Soham",     role: "Builder" },
  { name: "Harsh Bhojak",      team: "Soham",     role: "Closer"  },
  { name: "Nikunj Patel",      team: "Soham",     role: "Closer"  },
  { name: "Lekhraj Prajapati", team: "Tejasvi",   role: "Builder" },
  { name: "Nupur Vyas",        team: "Tejasvi",   role: "Builder" },
  { name: "Yash Mishra",       team: "Tejasvi",   role: "Closer"  },
  { name: "Kartik Deshawar",   team: "Tejasvi",   role: "Closer"  },
  { name: "Abhijeet Das",      team: "Tejasvi",   role: "Closer"  },
  { name: "Shivam Rathi",      team: "Mamta Das", role: "Builder" },
  { name: "Soumya Singh",      team: "Mamta Das", role: "Builder" },
  { name: "Nishant Sharma",    team: "Mamta Das", role: "Builder" },
  { name: "Pranali Mishra",    team: "Mamta Das", role: "Closer"  },
  { name: "Meet Patel",        team: "Mamta Das", role: "Closer"  },
  { name: "Vidhi Patel",       team: "Mamta Das", role: "Closer"  },
];

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Scoring — identical formulas to live/public/index.html ──────────────────
const B_T = { calls:150, minutes:180, leads:4, discoveries:2, presBooked:2, presCompleted:2 };
const B_W = { calls:0.20, minutes:0.20, leads:0.10, discoveries:0.15, presBooked:0.10, presCompleted:0.25 };
const C_T = { calls:60, minutes:120, presentations:2 };
const C_W = { calls:0.40, minutes:0.20, presentations:0.40 };
const cap = (v, t) => Math.min(150, t > 0 ? (v / t) * 100 : 0);

function scoreBuilder(b, t) {
  return Math.round(
    cap(b.calls,t.calls)*B_W.calls + cap(b.minutes,t.minutes)*B_W.minutes +
    cap(b.leads,t.leads)*B_W.leads + cap(b.discoveries,t.discoveries)*B_W.discoveries +
    cap(b.presBooked,t.presBooked)*B_W.presBooked + cap(b.presCompleted,t.presCompleted)*B_W.presCompleted
  );
}
function scoreCloser(c, t) {
  const k = cap(c.calls,t.calls)*C_W.calls + cap(c.minutes,t.minutes)*C_W.minutes + cap(c.presentations,t.presentations)*C_W.presentations;
  if (c.dealsClosed >= 2) return Math.round(Math.min(Math.max(k * 1.50, 110), 150));
  if (c.dealsClosed === 1) return Math.round(Math.min(Math.max(k * 1.25, 95), 125));
  return Math.round(Math.min(k, 110));
}
const zone = s => s >= 110 ? "gold" : s >= 95 ? "green" : s >= 75 ? "yellow" : s >= 50 ? "orange" : "red";
const zoneCloser = (c, s) => (c.calls === 0 && c.dealsClosed === 0) ? "red" : zone(s);

const TIER = {
  gold:   { ink:"#ffd740", line:"rgba(255,215,64,0.62)",  bg:"linear-gradient(150deg,#1d1804 0%,#0b0a04 100%)", label:"Golden Card" },
  green:  { ink:"#00e676", line:"rgba(0,230,118,0.55)",   bg:"linear-gradient(150deg,#03210f 0%,#040d07 100%)", label:"Green Card" },
  yellow: { ink:"#ffab00", line:"rgba(255,171,0,0.5)",    bg:"linear-gradient(150deg,#1e1203 0%,#0c0803 100%)", label:"Yellow Card" },
  orange: { ink:"#ff6d00", line:"rgba(255,109,0,0.5)",    bg:"linear-gradient(150deg,#1e0c02 0%,#0c0502 100%)", label:"Orange Card" },
  red:    { ink:"#ff4d6a", line:"rgba(255,23,68,0.5)",    bg:"linear-gradient(150deg,#1c0209 0%,#0c0104 100%)", label:"Red Card" },
  leave:  { ink:"#59597a", line:"rgba(120,120,170,0.28)", bg:"linear-gradient(150deg,#0e0f16 0%,#090a10 100%)", label:"On Leave" },
};
const RGB = { gold:"255,215,64", green:"0,230,118", yellow:"255,171,0", orange:"255,109,0", red:"255,23,68", leave:"120,120,170" };
Object.keys(TIER).forEach(k => { TIER[k].rgb = a => `rgba(${RGB[k]},${a})`; });

const initials = n => n.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
const slug = n => n.toLowerCase().replace(/\s+/g, "-");
function avatarBgHtml(name) {
  return `<img class="tv-avatar-img" src="/photos/${slug(name)}.png"
    onerror="this.onerror=null;this.src='/photos/${slug(name)}.jfif';this.onerror=function(){this.style.display='none';this.nextElementSibling.style.opacity=1;};">`;
}
const barColor = p => p >= 100 ? "#00e676" : p >= 75 ? "#ffab00" : "#ff4d6a";

// ── Data fetching — test's report.js has no auth check, so no bearer token ──
async function fetchRole(role, startDate, endDate) {
  const res = await fetch(`/api/report?startDate=${startDate}&endDate=${endDate}&slot=7pm&role=${role}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `${role} fetch failed`);
  return data;
}
async function fetchLeaveMap(startDate, endDate) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/attendance?date=gte.${startDate}&date=lte.${endDate}&status=eq.leave&select=person_name,date`,
      { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } });
    if (!r.ok) return {};
    const rows = await r.json();
    const map = {}; rows.forEach(row => { map[row.person_name] = (map[row.person_name] || 0) + 1; });
    return map;
  } catch { return {}; }
}

// Working-hours day-fraction proration (today only) — mirrors index.html.
const WORK_START_H = 10.5, WORK_END_H = 19.5, WORK_HOURS = 9.0;
function estNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" })); }
function fmtDate(d) { return d.toLocaleDateString("en-CA", { timeZone: "America/New_York" }); }
function dayFraction(dateStr, isCustomRange) {
  if (isCustomRange) return 1; // a picked historical range is always "full"
  const todayEST = fmtDate(estNow());
  if (dateStr !== todayEST) return 1;
  const now = estNow();
  const h = now.getHours() + now.getMinutes() / 60;
  if (h <= WORK_START_H) return 0.01;
  if (h >= WORK_END_H) return 1;
  return (h - WORK_START_H) / WORK_HOURS;
}

// ── State ────────────────────────────────────────────────────────────────────
let STATE = {
  view: 0,          // 0 Builders, 1 Closers, 2 Team Leaders
  elapsed: 0,
  anim: 1,
  scale: 1,
  now: new Date(),
  builders: [],
  closers: [],
  leaveMap: {},
  isLive: true,
  rangeStart: null,
  rangeEnd: null,
};
const ROTATE_SECONDS = 30;

// Don't paint until real data has arrived — painting an empty board on
// initial fit(), then again on the resize event(s) the browser fires right
// after navigation, then again once data loads, is what produced the
// "blinks 3 times" flash when coming back to this page.
let _dataLoadedOnce = false;
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  STATE.scale = Math.max(0.1, s);
  if (_dataLoadedOnce) render();
}
let _resizeTimer = null;
function onResize() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(fit, 150);
}

// If data fetches keep failing (e.g. an expired auth session on a tab left
// open for hours), don't just sit there empty — reload the whole page after
// a few consecutive misses so it comes back with a fresh session.
let _consecutiveLoadFailures = 0;
async function loadData() {
  const today = fmtDate(estNow());
  const startDate = STATE.isLive ? today : STATE.rangeStart;
  const endDate = STATE.isLive ? today : STATE.rangeEnd;
  try {
    const [leaveMap, builderData, closerData] = await Promise.all([
      fetchLeaveMap(startDate, endDate),
      fetchRole("Builder", startDate, endDate),
      fetchRole("Closer", startDate, endDate),
    ]);
    const frac = dayFraction(endDate, !STATE.isLive);
    const T = Object.fromEntries(Object.entries(B_T).map(([k,v]) => [k, Math.max(1, Math.round(v * frac))]));
    const TC = Object.fromEntries(Object.entries(C_T).map(([k,v]) => [k, Math.max(1, Math.round(v * frac))]));

    STATE.builders = (builderData.builders || []).map(b => {
      const onLeave = (leaveMap[b.name] || 0) >= frac;
      const s = onLeave ? 0 : scoreBuilder(b, T);
      return { ...b, score: s, tier: onLeave ? "leave" : zone(s), role: "Builder", onLeave, team: teamOf(b.name) };
    }).sort((a,b) => (a.onLeave?1:0) - (b.onLeave?1:0) || b.score - a.score);

    STATE.closers = (closerData.closers || []).map(c => {
      const onLeave = (leaveMap[c.name] || 0) >= frac;
      const s = onLeave ? 0 : scoreCloser(c, TC);
      return { ...c, score: s, tier: onLeave ? "leave" : zoneCloser(c, s), role: "Closer", onLeave, team: teamOf(c.name) };
    }).sort((a,b) => (a.onLeave?1:0) - (b.onLeave?1:0) || b.score - a.score);

    STATE.now = new Date();
    _consecutiveLoadFailures = 0;
  } catch (e) {
    console.error("TV board data load failed:", e.message);
    _consecutiveLoadFailures++;
    if (_consecutiveLoadFailures >= 3) { location.reload(); return; }
  }
  render();
}

function teamOf(name) {
  const m = SALES_TEAM_MEMBERS.find(x => x.name === name);
  return m ? m.team : "—";
}

function personCard(p, i, isCloser) {
  const t = TIER[p.tier], anim = STATE.anim;
  const kdef = isCloser
    ? [["calls", p.calls, C_T.calls], ["minutes", p.minutes, C_T.minutes], ["pres held", p.presentations, C_T.presentations], ["deals", p.dealsClosed, 1]]
    : [["calls", p.calls, B_T.calls], ["minutes", p.minutes, B_T.minutes], ["q. leads", p.leads, B_T.leads], ["disco", p.discoveries, B_T.discoveries], ["pres bkd", p.presBooked, B_T.presBooked], ["pres cmp", p.presCompleted, B_T.presCompleted]];
  const celebrate = p.tier === "gold";
  const scoreLabel = p.onLeave ? "—" : Math.round(p.score * anim) + "%";
  const kpisHtml = kdef.map(([label, val, tgt]) => {
    const pct = cap(val, tgt);
    const bar = Math.min(100, (pct / 150) * 100).toFixed(0);
    return `<div style="border-radius:9px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06);padding:7px 9px;display:flex;flex-direction:column;justify-content:center;gap:4px">
      <div style="font-size:10px;font-weight:800;letter-spacing:1.2px;color:#8e98bb;text-transform:uppercase;white-space:nowrap;overflow:hidden">${label}</div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span style="font-family:'Nunito Sans',sans-serif;font-size:26px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#eef0f7">${val}</span>
        <span style="font-size:11px;font-weight:700;color:#6c769b">/ ${tgt}</span>
      </div>
      <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden">
        <div style="height:4px;border-radius:2px;background:${barColor(pct)};width:${bar}%"></div>
      </div>
    </div>`;
  }).join("");

  return `<div style="position:relative;border-radius:14px;padding:14px 16px;border:1.5px solid ${t.line};background:${t.bg};box-shadow:${p.onLeave?"none":"0 0 26px "+t.rgb(0.3)+", inset 0 0 46px "+t.rgb(0.06)};overflow:hidden;display:flex;flex-direction:column;gap:10px;animation:omRise 0.5s ease both">
    ${celebrate ? `<div style="position:absolute;top:0;bottom:0;left:0;width:150px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);animation:omShine 4.2s ease-in-out infinite;pointer-events:none"></div>` : ""}
    <div style="display:flex;align-items:flex-start;gap:11px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:58px">
        <div style="width:58px;height:58px;border-radius:50%;position:relative;border:2px solid ${t.line};background:rgba(255,255,255,0.06);overflow:hidden;display:flex;align-items:center;justify-content:center">
          ${avatarBgHtml(p.name)}
          <span style="position:absolute;font-family:'Nunito Sans',sans-serif;font-size:19px;font-weight:900;color:${t.ink};opacity:0">${initials(p.name)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-family:'Nunito Sans',sans-serif;font-size:19px;font-weight:900;line-height:1;color:${i===0&&!p.onLeave?"#0b0a04":t.ink};padding:1px 7px;border-radius:6px;background:${i===0&&!p.onLeave?t.ink:"rgba(255,255,255,0.07)"}">${p.onLeave?"—":i+1}</span>
        </div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Nunito Sans',sans-serif;font-size:18px;font-weight:800;line-height:1.15;letter-spacing:0px;color:${p.onLeave?"#7a7a99":"#f4f6fc"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
        <div style="font-size:12px;font-weight:700;letter-spacing:1.2px;color:#7b86ad;text-transform:uppercase;margin-top:2px">${p.team}</div>
        <div style="display:inline-flex;align-items:center;margin-top:5px;padding:3px 9px;border-radius:999px;border:1px solid ${t.ink};background:rgba(255,255,255,0.05)">
          <span style="font-size:11px;font-weight:900;letter-spacing:1.3px;color:${t.ink};text-transform:uppercase;white-space:nowrap">${t.label}</span>
        </div>
      </div>
      <div style="text-align:right;flex:none;width:92px">
        <div style="font-family:'Nunito Sans',sans-serif;font-size:46px;font-weight:900;line-height:0.95;color:${t.ink};text-shadow:${p.onLeave?"none":"0 0 20px "+t.ink};font-variant-numeric:tabular-nums">${scoreLabel}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${isCloser?2:3},minmax(0,1fr));gap:7px;flex:1;min-height:0">${kpisHtml}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;font-weight:800;letter-spacing:0.4px">
      <span style="color:#40c4ff">↙ ${p.inbound} in</span>
      <span style="color:#ff8a78">↗ ${p.outbound} out</span>
      <span style="color:#b388ff">✕ ${p.missed} miss</span>
    </div>
    ${p.onLeave ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,11,0.55);pointer-events:none">
      <div style="padding:8px 18px;border:2px dashed rgba(150,150,200,0.4);border-radius:8px;transform:rotate(-11deg);font-family:'Nunito Sans',sans-serif;font-size:24px;font-weight:900;letter-spacing:3px;color:rgba(160,160,205,0.6)">ON LEAVE</div>
    </div>` : ""}
  </div>`;
}

function teamCard(team, members) {
  const active = members.filter(m => !m.onLeave);
  const health = active.length ? Math.round(active.reduce((s,m) => s + m.score, 0) / active.length) : 0;
  const t = TIER[zone(health)];
  const anim = STATE.anim;
  const sortedMembers = [...active.sort((a,b) => b.score - a.score), ...members.filter(m => m.onLeave)];
  const membersHtml = sortedMembers.map(m => {
    const mt = TIER[m.tier];
    return `<div style="flex:1;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,0.05)">
      <div style="width:40px;height:40px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative">
        ${avatarBgHtml(m.name)}
        <span style="position:absolute;font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:900;color:${mt.ink};opacity:0">${initials(m.name)}</span>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Nunito Sans',sans-serif;font-size:22px;font-weight:800;line-height:1.1;color:${m.onLeave?"#7a7a99":"#f4f6fc"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1.5px;color:#6c769b;text-transform:uppercase">${m.role}</div>
      </div>
      <div style="width:112px;flex:none">
        <div style="height:5px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden">
          <div style="height:5px;border-radius:3px;background:${mt.ink};width:${m.onLeave?0:Math.min(100,(m.score/150)*100).toFixed(0)}%"></div>
        </div>
      </div>
      <div style="width:78px;text-align:right;flex:none;font-family:'Nunito Sans',sans-serif;font-size:28px;font-weight:900;color:${mt.ink};font-variant-numeric:tabular-nums">${m.onLeave?"—":Math.round(m.score*anim)+"%"}</div>
    </div>`;
  }).join("");

// Lightweight per-tick chrome update (clock/date/day-progress/pips) that
// patches only those DOM nodes directly, instead of rebuilding the whole
// board every 500ms — a full render() reset the ticker's CSS animation and
// reloaded every avatar <img> on each tick, which is what caused the
// screen-blink and the "stuck" marquee.
function updateChrome() {
  const clockEl = document.getElementById("tv-clock");
  if (!clockEl) return; // board not rendered yet
  const clock = STATE.now.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: true });
  const dateLabel = STATE.now.toLocaleDateString("en-US", { timeZone: "America/New_York", day: "numeric", month: "short", year: "numeric" }).toUpperCase();
  const est = estNow();
  const h = est.getHours() + est.getMinutes() / 60;
  const frac = h <= WORK_START_H ? 0.01 : h >= WORK_END_H ? 1 : (h - WORK_START_H) / WORK_HOURS;
  clockEl.textContent = clock;
  document.getElementById("tv-datelabel").textContent = dateLabel;
  document.getElementById("tv-fracbar").style.width = Math.round(frac*100)+"%";
  document.getElementById("tv-fracpct").textContent = Math.round(frac*100)+"% OF DAY";
  const view = STATE.view;
  document.getElementById("tv-pips").innerHTML = [0,1,2].map(i => {
    const fill = i < view ? 100 : i > view ? 0 : Math.min(100, (STATE.elapsed / ROTATE_SECONDS) * 100).toFixed(0);
    return `<div style="width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,0.12);overflow:hidden">
      <div style="height:5px;border-radius:3px;background:#eef0f7;width:${fill}%"></div>
    </div>`;
  }).join("");
}

// render() rebuilds the whole board's DOM, including every avatar <img>.
// Driving the count-up at 60fps via requestAnimationFrame recreated those
// images ~60 times in one second, which is what caused the card/number
// flicker on every load and every view rotation. A coarser, timeout-driven
// count-up (a dozen steps instead of ~60) still reads as a smooth animation
// but cuts the number of full rebuilds by 5x.
function runCountUp() {
  clearTimeout(window._tvCountTimer);
  const STEPS = 12, dur = 900;
  let i = 0;
  const step = () => {
    try {
      const k = Math.min(1, i / STEPS);
      STATE.anim = 1 - Math.pow(1 - k, 3);
      render();
      i++;
      if (k < 1) window._tvCountTimer = setTimeout(step, dur / STEPS);
    } catch (e) {
      console.error("TV board countUp step failed:", e.message);
      i++;
      window._tvCountTimer = setTimeout(step, dur / STEPS);
    }
  };
  STATE.anim = 0;
  step();
}

let _tick = null;
function startTicking() {
  if (_tick) clearInterval(_tick);
  _tick = setInterval(() => {
    try {
      STATE.elapsed += 0.5;
      STATE.now = new Date();
      if (STATE.elapsed >= ROTATE_SECONDS) {
        STATE.view = (STATE.view + 1) % 3;
        STATE.elapsed = 0;
        runCountUp();
      } else {
        updateChrome();
      }
    } catch (e) {
      console.error("TV board tick failed:", e.message);
    }
  }, 500);
}
let _dataRefresh = null;
function startDataRefresh() {
  if (_dataRefresh) clearInterval(_dataRefresh);
  _dataRefresh = setInterval(() => { if (STATE.isLive) loadData(); }, 3 * 60 * 1000);
}

function initBoard() {
  fit();
  window.addEventListener("resize", onResize);
  startTicking();
  startDataRefresh();
  loadData().then(() => { _dataLoadedOnce = true; runCountUp(); });
  // Kiosk safeguard: force a full reload every 4 hours so a tab left open
  // indefinitely always ends up running the latest deployed code and a
  // fresh session, without anyone needing to walk over and refresh it.
  setTimeout(() => location.reload(), 4 * 60 * 60 * 1000);
}

settingsBtn.onclick = () => {

  const s = document.getElementById("range-start").value;

  if (!s || !e) return;
  STATE.isLive = false;
  STATE.rangeStart = s;
  STATE.rangeEnd = e;
  document.getElementById("mode-note").textContent = `Currently: HISTORICAL (${s} to ${e}, rotation paused)`;
  if (_tick) clearInterval(_tick);
  loadData();
};
document.getElementById("btn-reset-live").onclick = () => {
  STATE.isLive = true;
  document.getElementById("mode-note").textContent = "Currently: LIVE (today, auto-rotating)";
  loadData();
  startTicking();
};
